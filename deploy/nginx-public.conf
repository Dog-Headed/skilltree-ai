# Requires the shared zones/log format in nginx-loopback.conf.
# Existing free certificate paths are preserved; no new public port is opened.
server {
    listen 80;
    server_name skilltree.goutouren.work;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/skilltree-acme; }
    location / { return 301 https://skilltree.goutouren.work$request_uri; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/skilltree-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skilltree-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name skilltree.goutouren.work;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    send_timeout 30s;
    access_log /var/log/nginx/skilltree-access.log skilltree_safe;
    error_log /var/log/nginx/skilltree-error.log warn;
    limit_req_status 429;
    limit_conn_status 429;
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8767;
    }
    location = /auth/login {
        limit_req zone=skilltree_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Evaluation-User "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /auth/register {
        limit_req zone=skilltree_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Evaluation-User "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=skilltree_read burst=200 nodelay;
        limit_req zone=skilltree_write burst=40 nodelay;
        limit_conn skilltree_conn 64;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Evaluation-User "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
