<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SkillTree 单位培训</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/fonts.css"><link rel="stylesheet" href="/assets/training.css"><script src="/assets/training-login.js" defer></script></head>
<body class="login-body"><main class="login-layout"><section class="login-story"><a class="brand" href="/">✳ SkillTree</a><p class="eyebrow">LEARNING AT WORK</p><h1>让学习扎根，<br>让能力生长。</h1><p>一个人的好奇，一群人的成长。<br>从自主探索到单位培训，在同一个空间继续前行。</p><div class="botanical-mark" aria-hidden="true">✳</div><small>单位培训版 · Day 1</small></section>
<section class="login-panel"><p class="eyebrow">欢迎来到单位学习空间</p><h2>登录 SkillTree</h2><p class="muted">使用演示账号，进入对应的管理员或员工首页。</p>
<form id="login-form"><label for="account">账号邮箱</label><input id="account" type="email" autocomplete="username" required maxlength="254" placeholder="请输入账号邮箱">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256">
<label class="remember"><input id="remember" type="checkbox" checked>在这台设备上保持登录</label>
<p id="login-error" role="alert" hidden></p><button class="primary" type="submit" id="login-submit">登录并进入</button></form>
<p class="login-note">本阶段使用四个预置账号。账号使用方式见交付的启动说明；管理员权限由服务器确认。</p>
<a href="/" class="back">返回首页 →</a></section></main></body></html>
