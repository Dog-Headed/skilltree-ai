<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1017" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101720'/%3E%3Cpath d='M9 24V7h13M9 16h13M22 7v4M22 16v4' fill='none' stroke='%23c8f36a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="SkillTree AI：从学习目标出发，通过讲解、测验和诊断，逐步点亮你的 Python 技能路径。"
    />
    <title>SkillTree AI · 学习工作台</title>
    <style>
      /* 01. Design tokens */
      :root {
        color-scheme: dark;
        --bg: #0b1017;
        --side: #101720;
        --surface: #141b25;
        --raised: #1c2633;
        --line: #273242;
        --line-soft: #202a37;
        --text: #e9eef5;
        --muted: #a8b3c2;
        --dim: #7b8b9e;
        --green: #c8f36a;
        --cyan: #6dd4e7;
        --amber: #f5bc75;
        --red: #f28b91;
        --radius: 14px;
        --small: 8px;
        --transition: 180ms;
        --font:
          "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        --mono: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.6;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }
      button {
        border: 0;
        color: inherit;
        background: none;
      }
      a {
        color: var(--cyan);
        text-underline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 4px;
      }
      ::selection {
        background: #c8f36a33;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin-top: 0;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      textarea {
        resize: vertical;
      }
      input,
      textarea {
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--dim);
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip-link {
        position: fixed;
        top: -60px;
        left: 230px;
        z-index: 100;
        background: var(--green);
        color: var(--bg);
        padding: 12px 20px;
      }
      .skip-link:focus {
        top: 8px;
      }
      .mono {
        font-family: var(--mono);
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font: 11px/1.5 var(--mono);
        color: var(--dim);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .icon {
        width: 20px;
        height: 20px;
      }
      .btn {
        white-space: nowrap;
        min-height: 44px;
        padding: 11px 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: var(--small);
        border: 1px solid var(--line);
        font-size: 14px;
        font-weight: 600;
        transition:
          background var(--transition),
          transform var(--transition),
          border-color var(--transition);
      }
      .btn:hover:not(:disabled) {
        background: var(--raised);
        border-color: #455568;
      }
      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--green);
        border-color: var(--green);
        color: #17200d;
      }
      .btn.primary:hover:not(:disabled) {
        background: #d6fa91;
        border-color: #d6fa91;
      }
      .btn.subtle {
        border-color: transparent;
        color: var(--muted);
      }
      .btn.subtle:hover {
        color: var(--text);
      }
      .icon-button {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        color: var(--muted);
      }
      .icon-button:hover {
        background: var(--raised);
        color: var(--text);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.green {
        color: var(--green);
        background: #c8f36a0b;
        border-color: #c8f36a30;
      }
      .chip.cyan {
        color: var(--cyan);
        background: #6dd4e709;
        border-color: #6dd4e730;
      }
      .chip.amber {
        color: var(--amber);
        background: #f5bc7509;
        border-color: #f5bc7530;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }
      /* 02. Workspace shell */
      .app {
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
      }
      .sidebar {
        background: var(--side);
        border-right: 1px solid var(--line-soft);
        position: sticky;
        top: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 28px 16px 20px;
        z-index: 40;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 8px;
        margin-bottom: 32px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
        color: var(--green);
      }
      .brand-name {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.7px;
      }
      .brand-name span {
        font-weight: 400;
        color: var(--green);
      }
      .brand-caption {
        font: 9px/1.5 var(--mono);
        letter-spacing: 1.8px;
        color: var(--dim);
      }
      .new-project {
        width: 100%;
        background: #c8f36a0a;
        border-color: #c8f36a38;
        color: var(--green);
        margin-bottom: 30px;
      }
      .sidebar-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
        margin-bottom: 12px;
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--dim);
      }
      .project-list {
        overflow-y: auto;
        min-height: 0;
        flex: 1;
      }
      .project-row {
        display: flex;
        align-items: stretch;
        margin-bottom: 6px;
      }
      .project-item {
        min-width: 0;
        flex: 1;
        text-align: left;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        transition: background var(--transition);
      }
      .project-item > .icon {
        margin-top: 3px;
        color: var(--dim);
        width: 17px;
        height: 17px;
      }
      .project-item:hover {
        background: var(--surface);
      }
      .project-item.active {
        background: #c8f36a08;
        border-color: #c8f36a20;
      }
      .project-item.active > .icon {
        color: var(--green);
      }
      .project-item > div { min-width: 0; }
      .project-more {
        flex-shrink: 0;
        width: 32px;
        font-size: 23px;
        color: var(--dim);
        border-radius: 6px;
      }
      .project-more:hover { color: var(--text); background: var(--surface); }
      .project-more:disabled { opacity: .4; cursor: not-allowed; }
      .btn.danger, .menu-danger { color: var(--red); }
      .project-menu {
        position: fixed; z-index: 110; min-width: 148px; padding: 5px;
        background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 8px 28px #0005;
      }
      .project-menu button { display: block; width: 100%; padding: 10px 12px; text-align: left; border-radius: 6px; font-size: 13px; }
      .project-menu button:hover, .project-menu button:focus-visible { background: var(--surface); }
      .rename-input { width: 100%; box-sizing: border-box; margin: 10px 0; padding: 11px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
      .project-name {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.65;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .project-meta {
        font-size: 10px;
        color: var(--dim);
        margin-top: 6px;
      }
      .project-empty {
        padding: 16px 10px;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.9;
      }
      .sidebar-footer {
        border-top: 1px solid var(--line-soft);
        padding: 20px 8px 0;
        margin-top: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .sidebar-footer > .icon {
        color: var(--dim);
        width: 18px;
        height: 18px;
      }
      .local-title {
        font-size: 11px;
        color: var(--muted);
      }
      .local-caption {
        font-size: 10px;
        color: var(--dim);
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        height: 76px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 32px;
        background: var(--bg);
      }
      .topbar-left {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .breadcrumb {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .breadcrumb > .icon {
        width: 16px;
        height: 16px;
        color: var(--dim);
      }
      .breadcrumb .separator {
        color: #4b5b6f;
      }
      .breadcrumb-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 440px;
      }
      .topbar-actions {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 10px;
      }
      .saved-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--dim);
        white-space: nowrap;
      }
      .saved-label .dot {
        color: var(--green);
      }
      .mobile-projects,
      .mobile-path {
        display: none;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 304px;
        min-height: calc(100dvh - 76px);
      }
      .main {
        min-width: 0;
        padding: 40px 48px 48px;
      }
      .main-inner {
        max-width: 800px;
        margin: 0 auto;
        animation: enter 0.2s ease-out;
      }
      .path-panel {
        background: var(--side);
        border-left: 1px solid var(--line-soft);
        padding: 32px 24px 24px;
        position: sticky;
        top: 76px;
        height: calc(100dvh - 76px);
        display: flex;
        flex-direction: column;
        min-width: 0;
        z-index: 30;
      }
      .panel-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .panel-heading h2 {
        font-size: 15px;
        letter-spacing: 0.4px;
        margin: 0;
      }
      .panel-heading > .icon {
        width: 17px;
        height: 17px;
        color: var(--dim);
      }
      .path-caption {
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 24px;
      }
      .progress-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 10px;
      }
      .progress-number {
        font: 36px/1 var(--mono);
        font-weight: 500;
        letter-spacing: -2px;
      }
      .progress-number small {
        font: 13px var(--mono);
        color: var(--dim);
        letter-spacing: 0;
        margin-left: 8px;
      }
      .progress-note {
        font-size: 11px;
        color: var(--dim);
      }
      .progress-track {
        height: 4px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .progress-fill {
        height: 100%;
        background: var(--green);
        border-radius: 4px;
        transition: width 0.2s ease-out;
      }
      .path-list {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        margin: 0 -12px;
        padding: 2px 12px 16px;
      }
      .path-node {
        display: flex;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 12px 10px;
        margin-bottom: 8px;
        position: relative;
        transition:
          background var(--transition),
          border-color var(--transition);
      }
      .path-node:hover {
        background: var(--surface);
      }
      .path-node.current {
        background: #6dd4e708;
        border-color: #6dd4e73d;
        box-shadow: 0 0 22px #6dd4e703;
      }
      .node-symbol {
        width: 27px;
        height: 27px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 11px var(--mono);
        color: var(--dim);
        margin-top: 2px;
        flex-shrink: 0;
      }
      .node-symbol .icon {
        width: 14px;
        height: 14px;
      }
      .completed .node-symbol {
        color: var(--green);
        border-color: #c8f36a35;
        background: #c8f36a0a;
      }
      .current .node-symbol {
        color: var(--cyan);
        border-color: #6dd4e744;
        background: #6dd4e712;
      }
      .node-copy {
        min-width: 0;
        flex: 1;
      }
      .node-title {
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .locked .node-title {
        color: var(--muted);
      }
      .node-info {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        color: var(--dim);
        margin-top: 4px;
      }
      .current .node-state {
        color: var(--cyan);
      }
      .completed .node-state {
        color: var(--green);
      }
      .node-dependencies {
        font-size: 10px;
        color: var(--dim);
        line-height: 1.8;
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .path-legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        border-top: 1px solid var(--line-soft);
        padding: 16px 0;
        font-size: 10px;
        color: var(--dim);
      }
      .path-legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .path-legend .dot {
        width: 5px;
        height: 5px;
      }
      .current-target {
        border-top: 1px solid var(--line-soft);
        padding-top: 18px;
      }
      .target-label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--cyan);
        font-size: 11px;
        margin-bottom: 9px;
      }
      .target-label > .icon {
        width: 14px;
        height: 14px;
      }
      .current-target p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.85;
        margin-bottom: 6px;
      }
      .close-drawer {
        display: none;
      }
      .backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: #0008;
        z-index: 35;
      }
      .backdrop.visible {
        display: block;
      }
      /* 03. First project */
      .welcome {
        padding-top: 28px;
      }
      .welcome .eyebrow {
        color: var(--green);
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }
      .welcome h1 {
        font-size: clamp(28px, 2.5vw, 38px);
        font-weight: 600;
        line-height: 1.55;
        letter-spacing: -1px;
        margin-bottom: 18px;
      }
      .welcome h1 span {
        color: var(--green);
      }
      .welcome-intro {
        color: var(--muted);
        line-height: 1.9;
        font-size: 14px;
        max-width: 520px;
        margin-bottom: 38px;
      }
      .goal-form {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        padding: 24px;
        position: relative;
      }
      .form-title {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .form-title > .icon {
        color: var(--green);
        width: 18px;
        height: 18px;
      }
      .goal-form textarea {
        width: 100%;
        min-height: 128px;
        padding: 0;
        background: transparent;
        border: 0;
        line-height: 1.9;
        font-size: 15px;
        resize: vertical;
        display: block;
      }
      .goal-form textarea:focus {
        outline: 0;
      }
      .goal-form:focus-within {
        border-color: #c8f36a75;
        box-shadow: 0 0 0 3px #c8f36a05;
      }
      .goal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 16px;
      }
      .goal-hint {
        color: var(--dim);
        font-size: 11px;
        line-height: 1.8;
      }
      .goal-footer .btn {
        padding: 12px 20px;
      }
      .examples-title {
        font-size: 11px;
        color: var(--dim);
        margin: 24px 0 12px;
      }
      .examples {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .example {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        padding: 14px;
        text-align: left;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        transition:
          border-color var(--transition),
          background var(--transition);
      }
      .example:hover {
        border-color: #c8f36a50;
        background: var(--surface);
      }
      .example > .icon {
        width: 16px;
        height: 16px;
        color: var(--dim);
        margin-top: 2px;
      }
      .example-title {
        font-size: 12px;
        margin-bottom: 5px;
      }
      .example-desc {
        color: var(--dim);
        font-size: 10px;
        line-height: 1.8;
      }
      .workflow {
        margin-top: 44px;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--dim);
        font-size: 11px;
      }
      .workflow-step {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .workflow-step .icon {
        width: 15px;
        height: 15px;
      }
      .workflow > .icon {
        width: 12px;
        height: 12px;
        color: #47576a;
      }
      .welcome-foot {
        margin-top: 20px;
        font-size: 11px;
        color: var(--dim);
      }
      .path-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 64px;
      }
      .path-empty svg {
        width: 190px;
        height: 210px;
        align-self: center;
        margin-bottom: 16px;
      }
      .path-empty h3 {
        font-weight: 500;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
      }
      .path-empty p {
        color: var(--dim);
        font-size: 12px;
        text-align: center;
        line-height: 1.9;
        margin: 0 12px;
      }
      .empty-detail {
        border-top: 1px solid var(--line-soft);
        padding-top: 18px;
        font-size: 11px;
        line-height: 1.9;
        color: var(--dim);
      }
      /* 04. Lessons and tutor */
      .lesson-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }
      .lesson-index {
        font: 11px var(--mono);
        color: var(--dim);
        letter-spacing: 1.8px;
      }
      .lesson-heading h1 {
        font-size: 34px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -0.7px;
        overflow-wrap: anywhere;
        margin: 0 0 12px;
      }
      .lesson-description {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.9;
        margin-bottom: 22px;
      }
      .lesson-facts {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 24px;
      }
      .lesson-facts span {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .lesson-facts .icon {
        width: 14px;
        height: 14px;
      }
      .objectives {
        border-left: 2px solid #c8f36a77;
        padding: 0 0 0 16px;
        margin: 24px 0 32px;
      }
      .objectives-label {
        color: var(--green);
        font-size: 11px;
        margin-bottom: 8px;
      }
      .objectives p {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.9;
        margin: 4px 0;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        gap: 28px;
        margin-bottom: 30px;
      }
      .tab {
        min-height: 47px;
        padding: 0 0 13px;
        font-size: 13px;
        color: var(--dim);
        position: relative;
      }
      .tab.active {
        color: var(--text);
      }
      .tab.active:after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--green);
      }
      .tab-count {
        background: var(--raised);
        color: var(--muted);
        font: 10px var(--mono);
        padding: 2px 5px;
        border-radius: 4px;
        margin-left: 7px;
      }
      .markdown {
        font-size: 16px;
        line-height: 1.85;
        overflow-wrap: anywhere;
        max-width: 76ch;
      }
      .markdown h1 {
        font-size: 27px;
        margin: 32px 0 18px;
      }
      .markdown h2 {
        font-size: 22px;
        font-weight: 600;
        margin: 30px 0 16px;
        letter-spacing: -0.4px;
      }
      .markdown h3 {
        font-size: 18px;
        font-weight: 600;
        margin: 26px 0 12px;
      }
      .markdown h4 {
        font-size: 16px;
        margin: 20px 0 10px;
      }
      .markdown > h1:first-child,
      .markdown > h2:first-child,
      .markdown > h3:first-child {
        margin-top: 0;
      }
      .markdown p {
        margin-bottom: 18px;
      }
      .markdown ul,
      .markdown ol {
        padding-left: 24px;
        margin: 12px 0 22px;
      }
      .markdown li {
        padding-left: 3px;
        margin: 7px 0;
      }
      .markdown li::marker {
        color: var(--dim);
      }
      .markdown strong {
        font-weight: 600;
        color: #f5f8fc;
      }
      .markdown code {
        font-family: var(--mono);
        font-size: 0.85em;
        color: var(--green);
        background: #c8f36a08;
        border: 1px solid #c8f36a16;
        border-radius: 4px;
        padding: 2px 6px;
        overflow-wrap: anywhere;
      }
      .markdown blockquote {
        border-left: 3px solid var(--cyan);
        background: #6dd4e706;
        margin: 24px 0;
        padding: 16px 20px;
        font-size: 14px;
        color: var(--muted);
      }
      .markdown blockquote p:last-child {
        margin-bottom: 0;
      }
      .markdown hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 30px 0;
      }
      .code-block {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 22px 0 26px;
        overflow: hidden;
        background: #101720;
        min-width: 0;
      }
      .code-header {
        height: 44px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-soft);
        font: 10px var(--mono);
        letter-spacing: 0.5px;
        color: var(--dim);
        background: #141c27;
      }
      .code-copy {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: var(--font);
        font-size: 10px;
        color: var(--muted);
        border-radius: 4px;
        padding: 3px 7px;
      }
      .code-copy:hover {
        color: var(--text);
        background: var(--raised);
      }
      .code-copy .icon {
        width: 12px;
        height: 12px;
      }
      .code-block pre {
        font: 13px/1.85 var(--mono);
        padding: 18px 20px;
        margin: 0;
        overflow-x: auto;
        tab-size: 4;
        white-space: pre;
        max-width: 100%;
      }
      .code-block pre code {
        font: inherit;
        padding: 0;
        border: 0;
        background: none;
        color: #cbd6e5;
        overflow-wrap: normal;
      }
      .syntax-key {
        color: #c9a7ed;
      }
      .syntax-string {
        color: var(--green);
      }
      .syntax-comment {
        color: #8497ac;
      }
      .syntax-number {
        color: var(--amber);
      }
      .table-scroll {
        overflow-x: auto;
        max-width: 100%;
        margin: 22px 0;
      }
      .markdown table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        min-width: 360px;
      }
      .markdown th,
      .markdown td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .markdown th {
        background: var(--surface);
        font-weight: 600;
      }
      .lesson-end {
        border-top: 1px solid var(--line);
        padding-top: 24px;
        margin-top: 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .lesson-end h3 {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 5px;
      }
      .lesson-end p {
        color: var(--dim);
        font-size: 11px;
        margin: 0;
      }
      .ask-area {
        margin-top: 28px;
      }
      .ask-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        margin-bottom: 12px;
        color: var(--muted);
      }
      .ask-label .icon {
        width: 16px;
        height: 16px;
        color: var(--cyan);
      }
      .ask-box {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 14px 14px 14px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .ask-box:focus-within {
        border-color: #6dd4e75b;
      }
      .ask-box textarea {
        width: 100%;
        border: 0;
        resize: none;
        min-height: 56px;
        max-height: 160px;
        font-size: 13px;
        line-height: 1.9;
        padding: 0;
      }
      .ask-box textarea:focus {
        outline: 0;
      }
      .send-button {
        background: var(--green);
        color: #17200d;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .send-button:hover {
        background: #d6fa91;
      }
      .ask-hint {
        color: var(--dim);
        font-size: 10px;
        margin-top: 8px;
      }
      .conversation {
        margin-top: 28px;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      .user-question {
        margin: 20px 0 24px;
        padding: 14px 18px;
        background: var(--raised);
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.85;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .turn-label {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 10px;
        letter-spacing: 0.5px;
        color: var(--cyan);
        margin-bottom: 14px;
      }
      .turn-label > .icon {
        width: 16px;
        height: 16px;
      }
      .notice {
        display: flex;
        gap: 12px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        font-size: 12px;
        line-height: 1.9;
        margin-bottom: 24px;
      }
      .notice > .icon {
        color: var(--cyan);
        margin-top: 2px;
        width: 18px;
        height: 18px;
      }
      .notice.amber {
        border-color: #f5bc752b;
        background: #f5bc7505;
      }
      .notice.amber > .icon {
        color: var(--amber);
      }
      .notice.green {
        border-color: #c8f36a30;
        background: #c8f36a05;
      }
      .notice.green > .icon {
        color: var(--green);
      }
      .notice strong {
        display: block;
        margin-bottom: 3px;
        font-weight: 600;
      }
      .notice p {
        color: var(--muted);
        margin: 0;
      }
      .notice .btn {
        margin-top: 12px;
      }
      .success-flash {
        animation: complete 0.65s ease-out;
      }
      .field-error {
        color: var(--red);
        font-size: 12px;
        line-height: 1.8;
        margin-top: 12px;
        margin-bottom: 0;
      }
      /* 05. Quiz and results */
      .quiz-intro {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.9;
        margin: 0 0 24px;
      }
      .quiz-progress {
        display: flex;
        gap: 6px;
        margin: 20px 0 32px;
      }
      .quiz-progress span {
        flex: 1;
        height: 3px;
        background: var(--line);
        border-radius: 3px;
      }
      .quiz-progress span.filled {
        background: var(--green);
      }
      .question {
        padding: 0 0 28px;
        margin: 0 0 28px;
        border: 0;
        border-bottom: 1px solid var(--line);
        min-width: 0;
      }
      .question-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .question-number {
        font: 11px var(--mono);
        color: var(--green);
        letter-spacing: 1px;
      }
      .question-meta {
        font-size: 10px;
        color: var(--dim);
      }
      .question-prompt {
        font-size: 15px;
        line-height: 1.85;
        margin-bottom: 18px;
      }
      .question-prompt .markdown {
        font-size: 15px;
      }
      .question-prompt .markdown p:last-child {
        margin-bottom: 0;
      }
      .option {
        display: flex;
        gap: 12px;
        align-items: center;
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 15px;
        margin-bottom: 10px;
        min-height: 48px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1.8;
        transition:
          border-color var(--transition),
          background var(--transition);
        overflow-wrap: anywhere;
      }
      .option:hover {
        border-color: #536377;
        background: var(--surface);
      }
      .option:has(input:checked) {
        border-color: #c8f36a70;
        background: #c8f36a08;
      }
      .option input {
        appearance: none;
        position: relative;
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        border: 1px solid #5a697c;
        border-radius: 50%;
        margin: 0;
        background: transparent;
      }
      .option input[type="checkbox"] {
        border-radius: 4px;
      }
      .option input:checked {
        border-color: var(--green);
        background: var(--green);
        box-shadow: inset 0 0 0 4px var(--bg);
      }
      .option input[type="checkbox"]:checked {
        box-shadow: none;
      }
      .option input[type="checkbox"]:checked:after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 5px;
        height: 9px;
        border: solid var(--bg);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .option-key {
        font: 11px var(--mono);
        color: var(--dim);
        min-width: 12px;
      }
      .answer-text {
        width: 100%;
        min-height: 144px;
        padding: 16px;
        background: var(--surface);
        border-radius: 10px;
        line-height: 1.9;
        font-size: 14px;
        display: block;
      }
      .answer-label {
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 8px;
        display: block;
      }
      .quiz-footer {
        position: sticky;
        bottom: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-top: 1px solid var(--line);
        background: var(--bg);
        padding: 18px 0;
        margin-top: 8px;
      }
      .quiz-footer-left {
        font-size: 12px;
        color: var(--muted);
      }
      .quiz-footer-left strong {
        color: var(--green);
        font-family: var(--mono);
        font-weight: 500;
      }
      .quiz-footer-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .result-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 22px;
      }
      .result-summary {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 24px;
        background: var(--surface);
      }
      .score {
        color: var(--green);
        font: 40px/1 var(--mono);
        letter-spacing: -2px;
        white-space: nowrap;
      }
      .score.amber {
        color: var(--amber);
      }
      .score small {
        font: 12px var(--mono);
        color: var(--dim);
        letter-spacing: 0;
        margin-left: 6px;
      }
      .result-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .result-subtitle {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      .result-body {
        padding: 22px 24px;
      }
      .result-reason {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.9;
        margin-bottom: 12px;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .weak-points {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .weak-points .chip {
        max-width: 100%;
        white-space: normal;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .result-details {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 18px;
      }
      .result-details summary {
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        min-height: 44px;
      }
      .feedback-item {
        padding: 18px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .feedback-item:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .feedback-title {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .feedback-title span:last-child {
        color: var(--green);
        font-family: var(--mono);
        white-space: nowrap;
      }
      .feedback-prompt {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .feedback-item p {
        font-size: 12px;
        line-height: 1.9;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .feedback-evidence {
        color: var(--dim) !important;
      }
      .result-inline {
        margin-bottom: 26px;
      }
      .result-inline .result-summary {
        padding: 18px 22px;
      }
      .result-inline .score {
        font-size: 32px;
      }
      .result-inline .result-body {
        padding: 18px 22px;
      }
      .state-card {
        padding: 56px 0 32px;
      }
      .state-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        color: var(--cyan);
        margin-bottom: 24px;
      }
      .state-icon > .icon {
        width: 27px;
        height: 27px;
      }
      .state-card h1 {
        font-size: 30px;
        font-weight: 600;
        margin-bottom: 16px;
        line-height: 1.5;
      }
      .state-card > p {
        color: var(--muted);
        font-size: 14px;
        max-width: 540px;
        line-height: 1.9;
        margin-bottom: 24px;
      }
      .state-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .rounds {
        display: flex;
        gap: 32px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 22px 0;
        margin: 30px 0;
        color: var(--dim);
        font-size: 11px;
      }
      .rounds strong {
        display: block;
        font: 28px var(--mono);
        color: var(--text);
        margin-bottom: 6px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #c8f36a33;
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .status-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        border: 1px solid var(--line);
        background: var(--raised);
        border-radius: 10px;
        max-width: calc(100vw - 32px);
        padding: 12px 20px;
        box-shadow: 0 12px 40px #0005;
        font-size: 12px;
        line-height: 1.8;
      }
      .status-toast.error {
        border-color: #f28b9144;
        color: var(--red);
      }
      .busy-bar {
        position: sticky;
        top: 76px;
        z-index: 19;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 32px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .modal {
        max-width: min(540px, calc(100vw - 32px));
        width: 540px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 28px 100px #0007;
      }
      .modal::backdrop {
        background: #0009;
      }
      .modal h2 {
        font-size: 21px;
        margin-bottom: 14px;
      }
      .modal p {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.9;
        overflow-wrap: anywhere;
      }
      .modal .objectives {
        margin: 20px 0;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }
      .modal-status {
        margin-bottom: 18px;
      }
      .node-detail-deps {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }
      .deps-label {
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 8px;
      }
      .deps-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .app-error {
        max-width: 600px;
        margin: 0 auto;
      }
      .retry-load {
        margin-top: 16px;
      }
      .fade-in {
        animation: enter 0.2s ease-out;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes complete {
        0% {
          border-color: var(--green);
          box-shadow: 0 0 30px #c8f36a15;
        }
        100% {
          border-color: var(--line);
        }
      }
      /* 06. Responsive drawers and accessibility */
      @media (min-width: 1700px) {
        .main {
          padding: 48px 64px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr) 320px;
        }
        .topbar {
          padding: 0 48px;
        }
      }
      @media (max-width: 1199px) {
        .main {
          padding: 32px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
        .path-panel {
          padding: 28px 18px;
        }
        .lesson-heading h1 {
          font-size: 30px;
        }
        .breadcrumb-title {
          max-width: 320px;
        }
      }
      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .path-panel {
          position: fixed;
          visibility: hidden;
          top: 0;
          right: 0;
          height: 100dvh;
          width: 320px;
          max-width: 90vw;
          transform: translateX(100%);
          transition: transform 0.2s;
          z-index: 45;
          padding-top: 26px;
        }
        .path-panel.open {
          visibility: visible;
          transform: translateX(0);
        }
        .mobile-path {
          display: inline-flex;
        }
        .path-panel .close-drawer {
          display: inline-flex;
          margin-left: auto;
        }
        .main {
          padding: 36px 44px;
        }
        .main-inner {
          max-width: 740px;
        }
        .topbar {
          padding: 0 24px;
        }
        .breadcrumb-title {
          max-width: 360px;
        }
      }
      @media (max-width: 700px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar {
          position: fixed;
          visibility: hidden;
          top: 0;
          left: 0;
          width: 270px;
          max-width: 85vw;
          transform: translateX(-100%);
          transition: transform 0.2s;
          z-index: 45;
        }
        .sidebar.open {
          visibility: visible;
          transform: translateX(0);
        }
        .sidebar .close-drawer {
          display: inline-flex;
          position: absolute;
          right: 12px;
          top: 21px;
        }
        .sidebar .brand {
          margin-bottom: 36px;
        }
        .mobile-projects {
          display: inline-flex;
        }
        .topbar {
          height: 64px;
          padding: 0 12px;
          gap: 8px;
        }
        .breadcrumb {
          font-size: 12px;
          gap: 7px;
        }

      function getDraft() {
        if (!current?.quiz) return {};
        const key = draftKey(activeId, current.quiz.assessment_id);
        if (!drafts.has(key)) {
          let stored;
          try {
            stored = JSON.parse(storage.get(key) || "{}");
          } catch {
            stored = {};
          }
          const result = { ...current.answers };
          for (const q of current.quiz.questions) {
            const value = stored[q.id];
            if (
              q.type === "multiple_choice" &&
              Array.isArray(value) &&
              value.every((v) => q.options?.includes(v))
            )
              result[q.id] = value;
            else if (
              q.type === "single_choice" &&
              typeof value === "string" &&
              q.options?.includes(value)
            )
              result[q.id] = value;
            else if (q.type === "short_answer" && typeof value === "string")
              result[q.id] = value;

        }
        return drafts.get(key);

          ),
        );
      }
      function renderState(root) {
        const page = current.page_state;
        if (page === "running") {
          renderWaiting(root);
          return;
        }
        const paused = page === "paused",
          complete = page === "completed",
          symbol = complete ? "check" : paused ? "pause" : "alert",
          title = complete
            ? "每一步，都算数。"
            : paused
              ? "休息一下，再继续前进。"
              : "学习进度还在。",
          description = complete
            ? `你已完成这条路径的全部 ${current.total_count} 个节点。回顾反馈，或者带着新的目标，开启下一段学习。`
            : paused
              ? "当前节点已达到本次测评轮数上限。可以休息，也可以主动增加 3 轮，给自己多一点练习的空间。"
              : current.error?.message ||
                "当前步骤未能完成，请查看状态后继续。";
        const card = el(
          "section",
          { class: "state-card" },
          el(
            "div",
            {
              class: "state-icon",
              style:
                "color:var(--" +
                (complete ? "green" : paused ? "amber" : "red") +
                ")",
            },
            icon(symbol),
          ),
          el(
            "div",
            { class: "eyebrow" },
            complete
              ? "PATH COMPLETED"
              : paused
                ? "TAKE YOUR TIME"
                : "PROGRESS SAVED",
          ),
          el("h1", {}, title),
          el("p", {}, description),
        );
        if (paused)
          card.append(
            el(
              "div",
              { class: "rounds" },
              el("div", {}, el("strong", {}, current.rounds), "已评分轮数"),
              el(
                "div",
                {},
                el("strong", {}, current.round_limit),
                "当前轮数上限",
              ),
            ),
            el(
              "div",
              { class: "state-actions" },
              actionButton("先休息", "rest", "btn", "pause"),
              actionButton("再试 3 轮", "retry_3", "btn primary", "arrow"),
            ),
          );
        else if (complete)
          card.append(
            el(
              "div",
              { class: "state-actions" },
              button("开启新的学习目标", startNew, "btn primary", "plus"),
            ),
          );
        else
          card.append(
            el(
              "div",
              { class: "state-actions" },
              current.allowed_actions.includes("retry")
                ? actionButton(
                    "重试当前步骤",
                    "retry",
                    "btn primary",
                    "refresh",
                  )
                : null,
              button("刷新状态", () => loadProject(activeId), "btn", "refresh"),
              button("新建学习项目", startNew, "btn subtle", "plus"),
            ),
          );
        root.append(card);
        if (current.results.length)
          root.append(
            el(
              "div",
              { class: "tabs" },
              el("div", { class: "tab active" }, "已保存的测评记录"),
            ),
            ...current.results.map((r) => resultCard(r)),
          );
      }
      function renderLoadError(message, retry) {
        $("mainContent").replaceChildren(
          el(
            "section",
            { class: "state-card app-error" },
            el(
              "div",
              { class: "state-icon", style: "color:var(--red)" },
              icon("alert"),
            ),
            el("h1", {}, "暂时无法读取学习状态"),
            el("p", {}, message),
            el(
              "div",
              { class: "state-actions" },
              button("重新读取状态", retry, "btn primary", "refresh"),
              button("返回新建项目", startNew, "btn", "plus"),
            ),
          ),
        );
        updateBusy();
      }
      function showNode(node) {
        const d = $("detailDialog"),
          map = new Map(current.nodes.map((n) => [n.id, n]));
        d.replaceChildren(
          el(
            "div",
            { class: "modal-status" },
            el(
              "span",
              {
                class:
                  "chip " +
                  (node.status === "completed"
                    ? "green"
                    : node.status === "learning"
                      ? "cyan"
                      : ""),
              },
              nodeLabels[node.status],
            ),
          ),
          el("h2", { id: "detailTitle" }, node.title),
          el("p", {}, node.description),
          objectives(node),
          el(
            "div",
            { class: "node-detail-deps" },
            el(
              "div",
              { class: "deps-label" },
              node.prerequisite_ids.length
                ? "前置条件 · 以下节点全部完成后解锁"
                : "起点节点 · 无前置条件",
            ),
            el(
              "div",
              { class: "deps-list" },
              node.prerequisite_ids.map((id) =>
                el(
                  "span",
                  {
                    class:
                      "chip " +
                      (map.get(id)?.status === "completed" ? "green" : ""),
                  },
                  map.get(id)?.status === "completed"
                    ? icon("check")
                    : icon("lock"),
                  map.get(id)?.title || id,
                ),
              ),
            ),
          ),
          el(
            "p",
            { class: "muted", style: "margin-top:20px;font-size:11px" },
            "学习顺序由当前进度决定。这里可以查看节点目标与依赖。",
          ),
          el(
            "div",
            { class: "modal-actions" },
            button("知道了", () => d.close(), "btn primary"),
          ),
        );
        d.showModal();
      }
      /* 12. Initial read and visibility synchronization. */
      document.addEventListener("visibilitychange", async () => {
        if (
          document.visibilityState === "visible" &&
          activeId &&
          !busyProjects.has(activeId)
        ) {
          const id = activeId,
            token = generation;
          try {
            const data = await api("/projects/" + encodeURIComponent(id));
            if (
              id === activeId &&
              token === generation &&
              (data.pending_input_id !== current?.pending_input_id ||
                data.page_state !== current?.page_state ||
                data.retry_token !== current?.retry_token)
            ) {
              setCurrent(data);
              showToast("已同步这个项目的最新进度。");
            }
          } catch (error) {
            if (id === activeId && token === generation && error.status === 404) {
              removeProjectLocally(id);
              showToast("这个学习项目已在其他页面删除。");
            }
          }
        }
      });
      async function boot() {
        render();
        await refreshProjects();
        const saved = storage.get("skilltree.active");
        if (saved && projects.some((p) => p.project_id === saved))
          await loadProject(saved, false);
      }
      boot();
    </script>
  </body>
</html>
