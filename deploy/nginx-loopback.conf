# Only loopback is enabled before explicit approval for public exposure.
limit_req_zone $binary_remote_addr zone=skilltree_read:10m rate=10r/s;
map $request_method $skilltree_write_key {
    default "";
    POST $binary_remote_addr;
    PATCH $binary_remote_addr;
}
limit_req_zone $skilltree_write_key zone=skilltree_write:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=skilltree_conn:10m;
log_format skilltree_safe '$remote_addr $request_method $uri $status $request_time';

server {
    listen 127.0.0.1:8080;
    server_name 47.82.118.171;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    send_timeout 30s;
    access_log /var/log/nginx/skilltree-access.log skilltree_safe;
    error_log /var/log/nginx/skilltree-error.log warn;
    limit_req_status 429;
    limit_conn_status 429;
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8767;
    }
    location / {
        auth_basic "SkillTree competition evaluation";
        auth_basic_user_file /etc/skilltree/evaluators.htpasswd;
        limit_req zone=skilltree_read burst=30 nodelay;
        limit_req zone=skilltree_write burst=3 nodelay;
        limit_conn skilltree_conn 8;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Evaluation-User $remote_user;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
